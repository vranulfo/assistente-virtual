<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login da administração</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">
  <main class="container py-5 login-container">
    <form id="form-login" class="bg-light text-dark p-4 rounded">
      <h1 class="h3 mb-3">Acesso administrativo</h1>
      <div class="mb-3">
        <label for="senha" class="form-label">Senha</label>
        <input id="senha" type="password" class="form-control form-control-lg" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
      <p id="mensagem-login" class="text-danger mt-3 mb-0" aria-live="polite"></p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
