<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Administração</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white">

  <div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
      <h2 class="mb-0">🛠️ Painel de Administração</h2>
      <button id="sair-admin" type="button" class="btn btn-outline-light">Sair</button>
    </div>

    <section class="bg-light text-dark p-4 rounded mb-4" aria-labelledby="titulo-metricas">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
          <h3 id="titulo-metricas" class="mb-1">Tempo médio por tela</h3>
          <p class="text-secondary mb-0">Mede apenas o tempo em que a página ficou visível.</p>
        </div>
        <button id="atualizar-metricas" type="button" class="btn btn-primary">Atualizar métricas</button>
      </div>
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead><tr><th scope="col">Tela</th><th scope="col">Média</th><th scope="col">Visualizações</th><th scope="col">Tempo total</th></tr></thead>
          <tbody id="metricas-tempo"><tr><td colspan="4">Carregando...</td></tr></tbody>
        </table>
      </div>
      <p id="status-metricas" class="mt-3 mb-0" aria-live="polite"></p>
    </section>

    <form id="form-adicionar" class="bg-light text-dark p-4 rounded">
      <div class="mb-3">
        <label for="pergunta" class="form-label">Pergunta</label>
        <input type="text" class="form-control" id="pergunta" required>
      </div>
      <div class="mb-3">
        <label for="resposta" class="form-label">Resposta</label>
        <textarea class="form-control" id="resposta" rows="4" required></textarea>
      </div>
      <div id="proximas-container">
        <label>Próximas perguntas:</label>
        <div class="input-group mb-2">
          <input type="text" class="form-control campo-proxima" placeholder="Digite uma próxima pergunta">
          <button type="button" class="btn btn-outline-secondary" onclick="adicionarCampoProxima()">+</button>
        </div>
      </div>
      <div class="mb-3">
        <label for="imagem_url" class="form-label">URL da imagem (opcional)</label>
        <input type="text" id="imagem_url" class="form-control" placeholder="img/salvar_documento.png">
      </div>
      <button type="submit" class="btn btn-success">Adicionar</button>
      <div id="lista-perguntas" class="mt-4">
        <h4>Perguntas cadastradas</h4>
        <ul id="perguntas-cadastradas" class="list-group"></ul>
      </div>
    </form>
    

    <div id="mensagem" class="mt-3 fs-5"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
